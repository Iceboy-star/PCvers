<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechZone PC Store</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->

    <header>

        <div class="logo">
            ⚡ TechZone
        </div>

        <nav>
            <a href="#home">Home</a>
            <a href="#products">Products</a>
            <a href="#categories">Categories</a>
            <a href="#contact">Contact</a>
        </nav>

        <button class="cart-button" onclick="openCart()">
            🛒 Cart (<span id="cart-count">0</span>)
        </button>

    </header>


    <!-- HERO -->

    <section id="home" class="hero">

        <div class="hero-text">

            <h1>Build Your Dream PC</h1>

            <p>
                Premium PC components at affordable prices.
            </p>

            <a href="#products" class="shop-button">
                Shop Now
            </a>

        </div>

    </section>


    <!-- CATEGORIES -->

    <section id="categories">

        <h2>Shop by Category</h2>

        <div class="categories">

            <button onclick="filterProducts('all')">
                🖥️ All
            </button>

            <button onclick="filterProducts('cpu')">
                ⚡ Processors
            </button>

            <button onclick="filterProducts('gpu')">
                🎮 Graphics Cards
            </button>

            <button onclick="filterProducts('ram')">
                🧠 RAM
            </button>

            <button onclick="filterProducts('storage')">
                💾 Storage
            </button>

            <button onclick="filterProducts('motherboard')">
                🔧 Motherboards
            </button>

            <button onclick="filterProducts('psu')">
                🔌 PSU
            </button>

            <button onclick="filterProducts('monitor')">
                🖥️ Monitors
            </button>

        </div>

    </section>


    <!-- SEARCH -->

    <section class="search-section">

        <input
            type="text"
            id="search"
            placeholder="Search PC components..."
            onkeyup="searchProducts()"
        >

    </section>


    <!-- PRODUCTS -->

    <section id="products">

        <h2>Featured Products</h2>

        <div id="product-container" class="products">

        </div>

    </section>


    <!-- CART -->

    <div id="cart-modal" class="cart-modal">

        <div class="cart-box">

            <button class="close" onclick="closeCart()">
                ✕
            </button>

            <h2>Your Shopping Cart</h2>

            <div id="cart-items"></div>

            <hr>

            <h3>
                Total:
                ₹<span id="cart-total">0</span>
            </h3>

            <button class="checkout-button" onclick="checkout()">
                Proceed to Checkout
            </button>

        </div>

    </div>


    <!-- CONTACT -->

    <section id="contact" class="contact">

        <h2>Contact Us</h2>

        <p>Email: support@techzone.com</p>

        <p>Phone: +91 98765 43210</p>

    </section>


    <!-- FOOTER -->

    <footer>

        <p>
            © 2026 TechZone PC Store
        </p>

    </footer>


    <script src="script.js"></script>

</body>

</html>
